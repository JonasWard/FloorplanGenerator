name: Deploy UI to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['UI/**', 'Backend/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: UI
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain with the wasm target
        run: rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/wasm-bindgen
            ~/.cargo/registry
            Backend/target
          key: wasm-${{ runner.os }}-${{ hashFiles('Backend/Cargo.lock') }}

      - name: wasm-bindgen CLI (same version as Backend/Cargo.lock)
        run: |
          version=$(grep -A1 '^name = "wasm-bindgen"$' ../Backend/Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          if ! wasm-bindgen --version 2>/dev/null | grep -q "$version"; then
            cargo install wasm-bindgen-cli --version "$version" --locked --force
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: UI/package-lock.json

      - run: npm ci
      - name: Fetch dirty-geometry (vec2) and build the backend to wasm
        run: npm run setup
      - run: npm test
      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: UI/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
